<!doctype html>
<html lang="en">
<head>

<title>HatwarTech — Maintenance</title>

    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0c10;
    color: #f5f5f7;
    text-align: center;

  .card { max-width: 480px; }
  .brand {
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    color: #8a8f98;
    margin: 0 0 24px;

  h1 {
    font-size: 1.75rem;
    line-height: 1.3;
    margin: 0 0 12px;
    font-weight: 600;
  }
  p.message {
    font-size: 1rem;
    line-height: 1.6;
    color: #b4b8c0;

  }

  <div class="card">
    <p class="brand">HatwarTech</p>

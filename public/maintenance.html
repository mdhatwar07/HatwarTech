<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>HatwarTech — Maintenance</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f6f8fc;
    color: #0b1635;
    text-align: center;
  }
  .card { max-width: 480px; }
  .logo {
    width: 220px;
    max-width: 60vw;
    height: auto;
    margin: 0 0 32px;
  }
  h1 {
    font-size: 1.75rem;
    line-height: 1.3;
    margin: 0 0 12px;
    font-weight: 600;
    color: #0b1635;
  }
  p.message {
    font-size: 1rem;
    line-height: 1.6;
    color: #4d5773;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/images/Horizontal%20logo.png" alt="HatwarTech" width="1774" height="887" />

    <p class="message">We're building something new. We'll be back soon.</p>
  </div>
